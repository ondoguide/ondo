<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ONDO 방문 인증 현황</title>
<style>
  :root { --bg:#F5EFE6; --ink:#2A2622; --sub:#7A6F64; --line:#E2D8CB; --ok:#3F7A55; --no:#A4503A; --card:#FFFDF9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:14px; }
  .row { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px; display:flex; gap:12px; align-items:center; }
  .code { font-weight:800; letter-spacing:.12em; font-size:18px; min-width:64px; }
  .meta { flex:1; font-size:14px; line-height:1.5; }
  .meta small { color:var(--sub); }
  .ok { color:var(--ok); font-weight:700; } .no { color:var(--no); font-weight:700; }
  input { width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; font-size:15px; }
  button { padding:10px 14px; border:0; border-radius:10px; background:var(--ink); color:#F5EFE6; font-weight:700; font-size:14px; margin-top:8px; }
  .hide { display:none; }
</style>
</head>
<body>
<main>
  <h1>방문 인증 현황</h1>
  <div class="sub" id="sub">30초마다 새로고침돼요.</div>
  <div id="login" class="hide">
    <input id="key" type="password" placeholder="관리 키(ADMIN_KEY)">
    <button id="save">확인</button>
  </div>
  <div id="list"></div>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var key = ''; try { key = localStorage.getItem('ondo_admin_key') || ''; } catch (e) {}
  function t(ms) { var d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load() {
    if (!key) { $('login').classList.remove('hide'); return; }
    fetch('/api/checkins?key=' + encodeURIComponent(key), { cache: 'no-store' }).then(function (x) {
      if (x.status === 403) { key = ''; try { localStorage.removeItem('ondo_admin_key'); } catch (e) {} $('login').classList.remove('hide'); throw 0; }
      return x.json();
    }).then(function (rows) {
      $('login').classList.add('hide');
      var okN = rows.filter(function (x) { return x.ok; }).length;
      $('sub').textContent = '인증 ' + okN + '건 · 시도 ' + rows.length + '건 · 30초마다 새로고침';
      $('list').innerHTML = rows.length ? rows.map(function (x) {
        return '<div class="row"><div class="code">' + esc(x.code) + '</div><div class="meta">' + esc(x.name) +
          ' · ' + (x.ok ? '<span class="ok">인증됨</span>' : '<span class="no">거리 ' + x.d + 'm</span>') +
          '<br><small>' + t(x.at) + ' · 오차 ' + x.acc + 'm · 시도 ' + x.tries + '회 · ' + esc(x.r) + '</small></div></div>';
      }).join('') : '<div class="sub">아직 인증이 없어요.</div>';
    }).catch(function () {});
  }
  $('save').onclick = function () { key = $('key').value.trim(); try { localStorage.setItem('ondo_admin_key', key); } catch (e) {} load(); };
  load(); setInterval(load, 30000);
})();
</script>
</body>
</html>
